version: '3.8'

services:
  honeypot:
    build: 
      context: ./honeypot
    ports:
      - "2222:2222"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ORCHESTRATOR_URL=http://host.docker.internal:8000/new_command
    networks:
      - honeypot_net
    restart: unless-stopped
    # Opzionale: limita le risorse per evitare che l'attaccante esaurisca la CPU dell'host
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

networks:
  honeypot_net:
    driver: bridge