services:
  honeypot:
    build: 
      context: ./honeypotContainer
    ports:
      - "2222:2222"
    environment:
      - ORCHESTRATOR_URL=http://agentic-system:8000/new_command
    networks:
      - honeypot_net
    restart: unless-stopped
    depends_on:
      - agentic-system

  agentic-system:
    build:
      context: ./agentContainer
    networks:
      - honeypot_net
      - backend_net
    environment:
      - BACKEND_MCP_URL=http://backend:8000/sse
      - FORGERY_MCP_URL=http://mcp-forgery:8000/sse
      - PROVIDER=cloud
      - MODEL_NAME=deepseek/deepseek-v4-flash
      - NUM_PREDICTION=5
    secrets:
      - llm_config_secret
    depends_on:
      - backend
      - mcp-forgery
    restart: unless-stopped

  backend:
    build: ./backendContainer
    volumes:
      - type: bind
        source: /media/matteo/T9/Cybersecurity/chroma_storage_ctx5        # Modifica percorso -> percorso rag db
        target: /app/data/vector_db
        bind:
          create_host_path: false
      - type: bind
        source: /media/matteo/T9/Cybersecurity/sessions                   # Modifica percorso -> percorso cartella file di sessione
        target: /app/data/sessions
        bind:
          create_host_path: false
      - type: bind
        source: /media/matteo/T9/Cybersecurity/artifacts                  # Modifica percorso -> percorso file .jsonl artefatti
        target: /app/data/artifacts
        bind:
          create_host_path: false
    networks:
      - backend_net
    
  mcp-forgery:
    build: 
      context: ./mcpForgeryContainer
    networks:
      - honeypot_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Scrive direttamente usando il socket di Docker nel container!

networks:
  honeypot_net:
    driver: bridge
  backend_net:
    driver: bridge

secrets:
  llm_config_secret:
    file: ./.env