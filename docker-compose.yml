version: '3.8'

services:
  honeypot:
    build: 
      context: ./honeypot
    ports:
      - "2222:2222"
    environment:
      # Punta all'Orchestratore
      - ORCHESTRATOR_URL=http://ai-orchestrator:8000/new_command
    networks:
      - honeypot_net
    restart: unless-stopped
    depends_on:
      - ai-orchestrator

  ai-orchestrator:
    build:
      context: ./agentContainer
    volumes:
      # Montiamo i dati persistenti sull'host
      - /media/matteo/T9/Cybersecurity/chroma_storage_ctx5:/app/data/vector_db
      - /media/matteo/T9/Cybersecurity/sessions:/app/data/sessions
    networks:
      - honeypot_net
    restart: unless-stopped

networks:
  honeypot_net:
    driver: bridge